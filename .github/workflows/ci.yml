name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: false
      - name: Install Weave from main
        run: go install github.com/prulloac/weave/cmd/weave@main
      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Check skills
        run: ./scripts/check.sh
      - name: Conformance
        run: WEAVE_BIN="$(go env GOPATH)/bin/weave" ./scripts/conformance.sh
